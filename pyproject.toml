[project]
name = "awesome-llm-apps"
version = "0.1.0"
description = "A curated collection of Awesome LLM apps built with RAG, AI Agents, Multi-agent Teams, MCP, Voice Agents, and more"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Shubham Saboo" }
]

# Core dependencies used across multiple projects
dependencies = [
    "streamlit>=1.28.0",
    "openai>=1.0.0",
    "ollama>=0.6.1",
    "langchain-openai>=1.0.3",
    "browser-use>=0.9.7",
    "agno>=2.2.13",
    "ddgs>=9.9.1",
    "agents>=1.4.0",
    "tensorflow>=2.20.0",
    "contrib>=0.3.0",
    "lancedb>=0.25.3",
    "crewai>=1.5.0",
    "crewai-tools>=1.5.0",
    "gradio>=5.50.0",
    "elevenlabs>=2.24.0",
    "langchain-google-genai>=3.0.0",
]

[project.optional-dependencies]
# AI Agent frameworks
agents = [
    "agno>=2.2.10",
    "openai-agents",
    "mcp-agent>=0.0.14",
]

# RAG and Vector Stores
rag = [
    "lancedb",
    "pypdf",
    "faiss-cpu",
]

# Web and API tools
web = [
    "firecrawl-py",
    "google-search-results",
    "icalendar",
]

# Local LLM support
local-llm = [
    "ollama",
]

# Voice AI
voice = [
]

# MCP Agents
mcp = [
    "mcp-agent>=0.0.14",
    "asyncio>=3.4.3",
]

# Development tools
dev = [
    "pytest",
    "ruff",
    "mypy",
]

# CrewAI Version (crewai_version 디렉토리용)
crewai = [
    # Core AI Agent Framework
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    # LangChain integrations (버전 호환성 맞춤)
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-anthropic>=0.2.0",
    # UI Framework
    "gradio>=5.0.0",
    # LLM Providers
    "anthropic>=0.30.0",
    "groq>=0.11.0",
    "together>=1.0.0",
    # Vector Databases
    "qdrant-client>=1.10.0",
    "chromadb>=0.5.0",
    # Document Processing
    "pypdf>=4.0.0",
    "unstructured>=0.15.0",
    "python-docx>=1.0.0",
    # Web & Browser
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    # Audio/Voice
    "elevenlabs>=1.0.0",
    "deepgram-sdk>=3.0.0",
    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    # Memory & Storage
    "mem0ai>=0.1.0",
    "redis>=5.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
]

# All dependencies for development
all = [
    "agno>=2.2.10",
    "openai-agents",
    "mcp-agent>=0.0.14",
    "lancedb",
    "pypdf",
    "faiss-cpu",
    "firecrawl-py",
    "google-search-results",
    "icalendar",
    "ollama",
    "asyncio>=3.4.3",
    "pytest",
    "ruff",
    "mypy",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

# Mark this as a virtual project (no package to build)
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
